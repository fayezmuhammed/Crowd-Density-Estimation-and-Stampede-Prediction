<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrowdSafe AI Dashboard</title>
    <!-- Tailwind CSS for robust, modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js for live graphing -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');

        :root {
            --bg-color: #0f172a;
            --text-main: #f8fafc;
            --text-secondary: #94a3b8;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --card-inner: rgba(51, 65, 85, 0.4);
            --chart-grid: rgba(255, 255, 255, 0.05);
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --accent-blue: #38bdf8;
        }

        .light-mode {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-secondary: #64748b;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
            --card-inner: #f1f5f9;
            --chart-grid: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
            --accent-blue: #2563eb;
        }
        
        body { 
            background-color: var(--bg-color); 
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        
        .glass-panel { 
            background: var(--glass-bg); 
            backdrop-filter: blur(12px); 
            border: 1px solid var(--glass-border);
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        
        .critical { color: #ef4444; text-shadow: 0 0 10px rgba(239, 68, 68, 0.3); }
        .warning { color: #f59e0b; text-shadow: 0 0 10px rgba(245, 158, 11, 0.3); }
        .safe { color: #10b981; text-shadow: 0 0 10px rgba(16, 185, 129, 0.3); }

        .theme-toggle {
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 9999px;
            background: var(--card-inner);
            border: 1px solid var(--glass-border);
            transition: all 0.2s;
        }
        .theme-toggle:hover {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8">
    <div class="max-w-6xl mx-auto space-y-6">
        <!-- Header -->
        <header class="flex flex-col md:flex-row justify-between items-center glass-panel p-6 rounded-2xl">
            <div>
                <h1 class="text-3xl font-extrabold bg-clip-text text-transparent bg-gradient-to-r from-blue-500 to-emerald-500">
                    CrowdSafe AI 
                </h1>
                <p class="text-secondary mt-1 font-medium italic" style="color: var(--text-secondary)">Live Density Monitoring & Analytics</p>
            </div>
            <div class="mt-4 md:mt-0 flex items-center space-x-4">
                <button id="theme-btn" class="theme-toggle flex items-center space-x-2" title="Toggle Light/Dark Mode">
                    <span id="theme-icon">🌙</span>
                </button>
                <div class="flex items-center space-x-3 glass-panel px-4 py-2 rounded-full">
                    <div id="connection-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></div>
                    <span id="connection-status" class="text-sm font-semibold" style="color: var(--text-main)">Live Connection</span>
                </div>
            </div>
        </header>

        <!-- Main Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Current Count Card -->
            <div class="glass-panel p-8 rounded-2xl flex flex-col justify-center items-center relative overflow-hidden">
                <div class="absolute -right-10 -top-10 w-32 h-32 bg-blue-500/10 rounded-full blur-2xl"></div>
                <h2 class="font-bold uppercase tracking-wider text-xs mb-2" style="color: var(--text-secondary)">Current Crowd Count</h2>
                <div class="text-7xl font-black tabular-nums tracking-tighter safe transition-colors duration-500" id="live-count">
                    --
                </div>
                <div class="mt-4 text-sm flex items-center font-medium" style="color: var(--text-secondary)">
                    <span class="mr-2">Status:</span>
                    <span id="status-badge" class="px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500 font-bold border border-emerald-500/20">Safe</span>
                </div>
            </div>

            <!-- Parameters Card -->
            <div class="glass-panel p-6 rounded-2xl col-span-1 md:col-span-2">
                <h2 class="font-bold uppercase tracking-wider text-xs mb-4 border-b pb-2" style="border-color: var(--glass-border); color: var(--text-secondary)">System Parameters</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div class="bg-card-inner p-4 rounded-xl border" style="background: var(--card-inner); border-color: var(--glass-border)">
                        <p class="text-[10px] font-bold uppercase tracking-widest mb-1" style="color: var(--text-secondary)">Active Model</p>
                        <p class="text-xl font-bold text-blue-400" id="active-model">Loading...</p>
                    </div>
                    <div class="bg-card-inner p-4 rounded-xl border" style="background: var(--card-inner); border-color: var(--glass-border)">
                        <p class="text-[10px] font-bold uppercase tracking-widest mb-1" style="color: var(--text-secondary)">Processing State</p>
                        <p class="text-xl font-bold" id="app-state">Checking...</p>
                    </div>
                    <div class="bg-card-inner p-4 rounded-xl border" style="background: var(--card-inner); border-color: var(--glass-border)">
                        <p class="text-[10px] font-bold uppercase tracking-widest mb-1" style="color: var(--text-secondary)">Warning Threshold</p>
                        <p class="text-xl font-bold text-amber-500" id="warn-thresh">--</p>
                    </div>
                    <div class="bg-card-inner p-4 rounded-xl border" style="background: var(--card-inner); border-color: var(--glass-border)">
                        <p class="text-[10px] font-bold uppercase tracking-widest mb-1" style="color: var(--text-secondary)">Critical Threshold</p>
                        <p class="text-xl font-bold text-red-500" id="crit-thresh">--</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Chart Section -->
        <div class="glass-panel p-6 rounded-2xl h-96">
            <h2 class="font-bold uppercase tracking-wider text-xs mb-4" style="color: var(--text-secondary)">Live Density Trend</h2>
            <div class="w-full h-[300px] relative">
                <canvas id="densityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Theme Management
        const body = document.body;
        const themeBtn = document.getElementById('theme-btn');
        const themeIcon = document.getElementById('theme-icon');
        
        function setTheme(isLight) {
            if (isLight) {
                body.classList.add('light-mode');
                themeIcon.innerText = '☀️';
                localStorage.setItem('theme', 'light');
            } else {
                body.classList.remove('light-mode');
                themeIcon.innerText = '🌙';
                localStorage.setItem('theme', 'dark');
            }
            updateChartTheme();
        }

        themeBtn.onclick = () => {
            const isLight = !body.classList.contains('light-mode');
            setTheme(isLight);
        };

        // Initialize theme
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') setTheme(true);

        // Chart Configuration
        const ctx = document.getElementById('densityChart').getContext('2d');
        let chart;

        function updateChartTheme() {
            const isLight = body.classList.contains('light-mode');
            const accent = isLight ? '#2563eb' : '#38bdf8';
            const gridColor = isLight ? '#e2e8f0' : 'rgba(255, 255, 255, 0.05)';
            const tickColor = isLight ? '#64748b' : '#94a3b8';
            
            if (chart) {
                chart.options.scales.y.grid.color = gridColor;
                chart.options.scales.y.ticks.color = tickColor;
                chart.data.datasets[0].borderColor = accent;
                chart.update();
            } else {
                initChart(accent, gridColor, tickColor);
            }
        }

        function initChart(accent, gridColor, tickColor) {
            const gradient = ctx.createLinearGradient(0, 0, 0, 400);
            gradient.addColorStop(0, accent + '80'); // 50% opacity
            gradient.addColorStop(1, accent + '00'); // 0% opacity
            
            chart = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: [],
                    datasets: [{
                        label: 'Crowd Count',
                        data: [],
                        borderColor: accent,
                        backgroundColor: gradient,
                        borderWidth: 3,
                        pointRadius: 0,
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 0 },
                    plugins: {
                        legend: { display: false },
                        tooltip: {
                            mode: 'index',
                            intersect: false,
                            backgroundColor: 'rgba(15, 23, 42, 0.9)',
                            titleColor: '#fff'
                        }
                    },
                    scales: {
                        x: { display: false },
                        y: {
                            beginAtZero: true,
                            grid: { color: gridColor, drawBorder: false },
                            ticks: { color: tickColor }
                        }
                    }
                }
            });
        }

        updateChartTheme();

        const maxDataPoints = 60;

        async function updateDashboard() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();

                const countEl = document.getElementById('live-count');
                const stateEl = document.getElementById('app-state');
                const badgeEl = document.getElementById('status-badge');
                
                countEl.innerText = data.current_count !== null ? Math.round(data.current_count) : '--';
                
                if (data.is_processing) {
                    stateEl.innerText = 'Active (Processing)';
                    stateEl.style.color = '#10b981';
                } else {
                    stateEl.innerText = 'Idle / Stopped';
                    stateEl.style.color = 'var(--text-secondary)';
                    countEl.innerText = '--';
                }

                document.getElementById('active-model').innerText = data.model || 'None';
                document.getElementById('warn-thresh').innerText = data.thresholds.warning || '--';
                document.getElementById('crit-thresh').innerText = data.thresholds.critical || '--';

                countEl.className = 'text-7xl font-black tabular-nums tracking-tighter transition-colors duration-500';
                if (data.current_count >= data.thresholds.critical) {
                    countEl.classList.add('critical');
                    badgeEl.innerText = 'Critical';
                    badgeEl.className = 'px-3 py-1 rounded-full bg-red-500/10 text-red-500 font-bold border border-red-500/20 animate-pulse';
                } else if (data.current_count >= data.thresholds.warning) {
                    countEl.classList.add('warning');
                    badgeEl.innerText = 'Warning';
                    badgeEl.className = 'px-3 py-1 rounded-full bg-amber-500/10 text-amber-500 font-bold border border-amber-500/20';
                } else if (data.is_processing) {
                    countEl.classList.add('safe');
                    badgeEl.innerText = 'Safe';
                    badgeEl.className = 'px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-500 font-bold border border-emerald-500/20';
                } else {
                    countEl.style.color = 'var(--text-secondary)';
                    badgeEl.innerText = 'Offline';
                    badgeEl.className = 'px-3 py-1 rounded-full bg-slate-500/10 text-slate-500 font-bold border border-slate-500/20';
                }

                if (data.is_processing && data.current_count !== null) {
                    const now = new Date().toLocaleTimeString();
                    chart.data.labels.push(now);
                    chart.data.datasets[0].data.push(data.current_count);
                    if (chart.data.labels.length > maxDataPoints) {
                        chart.data.labels.shift();
                        chart.data.datasets[0].data.shift();
                    }
                    chart.update();
                }

                document.getElementById('connection-dot').className = 'w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse';
                document.getElementById('connection-status').innerText = 'Live Connection';

            } catch (error) {
                document.getElementById('connection-dot').className = 'w-2.5 h-2.5 rounded-full bg-red-500';
                document.getElementById('connection-status').innerText = 'Disconnected';
            }
        }

        setInterval(updateDashboard, 1000);
        updateDashboard();
    </script>
</body>
</html>
